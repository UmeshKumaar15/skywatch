# SkyWatch default configuration. Every section can be overridden by a user
# config file passed with --config, and individual keys via environment
# variables of the form SKYWATCH__SECTION__KEY=value.

zone:
  name: "Demo observation zone"
  origin: {lat: 52.3676, lon: 4.9041, alt: 0.0}   # ENU frame origin (used by real-sensor adapters)
  radius: 6000

# Sensor suite. In simulation these are simulated sensor models; real
# deployments use adapters (see skywatch/sensors/adapters.py) producing the
# same normalised observations.
sensors:
  - {id: radar-lr, type: radar, position: [0, 0, 15], rate_hz: 1.0, range: 14000, sigma_range: 10, sigma_az_deg: 0.3, sigma_el_deg: 0.7, reference_range: 22000, false_alarms_per_scan: 1.5, latency: [0.08, 0.02]}
  - {id: radar-drone, type: radar, anchor: depot0, height: 20, rate_hz: 2.0, range: 4500, sigma_range: 4, sigma_az_deg: 0.2, sigma_el_deg: 0.4, reference_range: 26000, false_alarms_per_scan: 0.8, latency: [0.05, 0.01]}
  - {id: lidar-depot, type: lidar, anchor: depot1, height: 15, rate_hz: 5.0, range: 700, sigma: 0.4, latency: [0.03, 0.01]}
  - {id: camera-park, type: camera, anchor: park0, height: 12, rate_hz: 5.0, range: 1500, fov_deg: 360, sigma_deg: 0.05, range_rel_sigma: 0.12, latency: [0.12, 0.03]}
  - {id: adsb-rx, type: adsb, position: [0, 0, 20], rate_hz: 1.0, range: 40000, message_loss: 0.05, latency: [0.6, 0.4]}
  - {id: rid-central, type: remote_id, position: [0, 0, 20], rate_hz: 1.0, range: 4500, message_loss: 0.1, latency: [0.7, 0.4]}
  - {id: rid-east, type: remote_id, anchor: depot1, height: 15, rate_hz: 1.0, range: 3500, message_loss: 0.1, latency: [0.7, 0.4], phase: 0.5}

pipeline:
  reorder_window: 1.6        # s; late observations are buffered and processed in timestamp order
  max_observation_age: 6.0   # s; older observations are discarded as stale
  snapshot_rate_hz: 4        # dashboard / storage snapshot rate
  history_seconds: 120       # per-track trail retained for display
  analytics_interval: 1.0    # s; minimum time between analytics updates of one track

tracking:
  gate_probability: 0.9995
  confirm_hits: 3
  confirm_window: 5
  tentative_max_age: 4.0      # s without update before a tentative track is dropped
  max_coast_time: 12.0        # s without update before a confirmed track is deleted
  init_velocity_sigma: 60.0
  process_noise: {cv: 0.6, ca: 3.0, ct: 1.0, turn_rate: 0.04}
  imm_transition_stay: 0.95
  merge_distance_sigma: 2.0

classification:
  model_path: models/classifier.npz
  smoothing: 0.15            # weight of each new likelihood in the recursive posterior
  unknown_threshold: 0.40
  min_features_age: 2.0

prediction:
  horizon: 60                # s
  step: 2                    # s between predicted points
  learned_model_path: models/motion_model.npz
  hypothesis_prune: 0.04     # hypotheses below this posterior weight are hidden
  weight_inertia: 0.75       # Bayesian update forgetting factor
  max_hypotheses: 5

intent:
  window: 90                 # s of history used for behaviour features
  stickiness: 0.97

anomaly:
  baselines_path: models/baselines.json
  min_track_age: 15          # s; filters need time to settle before kinematic anomaly tests
  emit_threshold: 0.6
  cooldown: 45               # s between insights of the same kind for a track
  hover_limits: {delivery_drone: 60, industrial_drone: 120, recreational_drone: 180, helicopter: 240}
  comms_loss_after: 8        # s since last cooperative message
  flowmap_cell: 400          # m
  flowmap_dir: data          # learned flow maps persist here per scenario/seed

storage:
  path: data/skywatch.db
  record: true
  frame_rate_hz: 2

server:
  host: 0.0.0.0
  port: 8000
  scenario: urban_mixed
  time_scale: 1.0
